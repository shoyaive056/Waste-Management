# Optional: local PostgreSQL. Use the same password in server/.env DATABASE_URL.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: smart_waste
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
